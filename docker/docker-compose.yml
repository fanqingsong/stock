services:
  instockdbservice:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mariadb:latest
    container_name: InStockDbService
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: instockdb
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - instock_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  instock:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mayanghua/instock:latest
    container_name: InStock
    ports:
      - "9988:9988"
    environment:
      db_host: InStockDbService
    volumes:
      - ./data/instockproxy.txt:/data/InStock/instock/config/proxy.txt
      # 使用本地代码：修复 push2 不可用（改走 push2delay）并支持分页抓取
      - ../instock:/data/InStock/instock
    depends_on:
      instockdbservice:
        condition: service_healthy
    networks:
      - instock_network

networks:
  instock_network:
    driver: bridge
